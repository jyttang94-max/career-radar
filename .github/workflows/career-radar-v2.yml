name: Career Radar V2

on:
  schedule:
    # 한국시간 매일 오전 8시
    - cron: "0 23 * * *"

  workflow_dispatch:

  push:
    paths:
      - "requirements.txt"
      - "sources.json"
      - "search_scope.json"
      - "radar.py"
      - "radar_v2.py"
      - "discovery.py"
      - ".github/workflows/career-radar-v2.yml"

permissions:
  contents: write

concurrency:
  group: career-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 패키지 설치
        run: python -m pip install -r requirements.txt

      - name: Chromium 설치
        run: python -m playwright install --with-deps chromium

      - name: 코드 및 설정 검사
        run: |
          python -m py_compile radar.py radar_v2.py discovery.py
          python -m json.tool sources.json > /dev/null
          python -m json.tool search_scope.json > /dev/null

      - name: 이번 실행 시작 시각 기록
        id: started
        run: |
          python - <<'PY'
          import os
          import time

          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"epoch={time.time()}\n")
          PY

      - name: 신설 기업재단 기사 탐색
        id: discovery
        continue-on-error: true
        run: python -u discovery.py

      - name: 보완판 채용 공고 수집
        id: radar
        continue-on-error: true
        run: python -u radar_v2.py

      - name: 실행 결과 점검 및 요약
        id: review
        if: always()
        env:
          START_EPOCH: ${{ steps.started.outputs.epoch }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
          RADAR_RESULT: ${{ steps.radar.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          start = float(os.environ.get("START_EPOCH") or "0")
          problems = []
          fresh_files = []

          def load_current(filename):
              path = Path("results") / filename
              if not path.exists():
                  return None

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  timestamp = datetime.fromisoformat(
                      data["run_at"]
                  ).timestamp()
              except (ValueError, KeyError, TypeError):
                  return None

              if not start or timestamp < start - 5:
                  return None

              return data

          jobs_data = load_current("latest.json")
          leads_data = load_current("foundation_leads.json")

          lines = [
              "# Career Radar V2 실행 결과",
              "",
              "신설 재단 탐색: "
              + os.environ.get("DISCOVERY_RESULT", "미실행"),
              "채용 공고 수집: "
              + os.environ.get("RADAR_RESULT", "미실행"),
              "",
          ]

          if jobs_data is not None:
              jobs = jobs_data.get("jobs", [])
              sources = jobs_data.get("sources", [])
              searches = [
                  item
                  for item in jobs_data.get("search_audits", [])
                  if "query" in item
              ]

              fresh_files.append("results/latest.json")

              report = Path("results/latest.md")
              if report.exists() and report.stat().st_mtime >= start:
                  fresh_files.append(str(report))

              day = jobs_data["run_at"][:10]
              daily = Path("results") / f"{day}.json"
              if daily.exists() and daily.stat().st_mtime >= start:
                  fresh_files.append(str(daily))

              matched = sum(
                  item.get("status") == "조건 충족"
                  for item in jobs
              )
              pending = sum(
                  item.get("status") == "확인 필요"
                  for item in jobs
              )
              failed_sources = sum(
                  item.get("state") in ("접속 실패", "실행 실패")
                  for item in sources
              )
              partial_sources = sum(
                  item.get("state") == "부분 실패"
                  for item in sources
              )
              search_failures = sum(
                  item.get("state") == "검색 실패"
                  for item in searches
              )
              empty_searches = sum(
                  item.get("state") == "응답 수신·유효 후보 없음"
                  for item in searches
              )

              lines.extend([
                  "이번 결과의 수집 시각: "
                  + jobs_data["run_at"],
                  "",
                  f"- 전체 후보: {len(jobs)}건",
                  f"- 조건 충족: {matched}건",
                  f"- 확인 필요: {pending}건",
                  f"- 점검 기관: {len(sources)}곳",
                  f"- 접속·실행 실패: {failed_sources}곳",
                  f"- 부분 실패: {partial_sources}곳",
                  f"- 확장 검색 요청: {len(searches)}건",
                  f"- 확장 검색 실패: {search_failures}건",
                  f"- 응답은 받았으나 유효 후보 없음: {empty_searches}건",
                  "",
                  "실행 성공 여부와 수집 정확도는 별개입니다.",
                  "조건 충족 0건을 실제 채용 공고 부재로 해석하지 마세요.",
              ])

              if not any(
                  item.get("pages", 0) > 0
                  for item in sources
              ):
                  problems.append("모든 기관 출처 확인 실패")

              if searches and all(
                  item.get("state") in (
                      "검색 실패",
                      "응답 수신·유효 후보 없음",
                  )
                  for item in searches
              ):
                  problems.append(
                      "확장 검색에서 유효 후보를 확보하지 못함"
                  )
          else:
              problems.append("이번 실행의 채용 결과가 없음")
              lines.append(
                  "이전 실행 결과를 이번 결과로 집계하지 않았습니다."
              )

          if leads_data is not None:
              fresh_files.append(
                  "results/foundation_leads.json"
              )

              leads_report = Path(
                  "results/foundation_leads.md"
              )
              if (
                  leads_report.exists()
                  and leads_report.stat().st_mtime >= start
              ):
                  fresh_files.append(str(leads_report))

              lines.extend([
                  "",
                  "신설 재단 기사 후보: "
                  + str(len(leads_data.get("leads", [])))
                  + "건",
              ])

          for variable in ("DISCOVERY_RESULT", "RADAR_RESULT"):
              if os.environ.get(variable) != "success":
                  problems.append(
                      variable + ": "
                      + os.environ.get(variable, "미실행")
                  )

          if problems:
              lines.extend(["", "## 확인이 필요한 문제", ""])
              lines.extend("- " + item for item in problems)

          Path("/tmp/career-radar-v2-files.json").write_text(
              json.dumps(fresh_files),
              encoding="utf-8",
          )
          Path("/tmp/career-radar-v2-review.json").write_text(
              json.dumps(
                  {"problems": problems},
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          summary = "\n".join(lines) + "\n"

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as file:
              file.write(summary)

          print(summary)
          PY

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-radar-v2-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

      - name: 이번 실행 결과를 저장소에 저장
        if: always() && steps.review.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = Path(
              "/tmp/career-radar-v2-files.json"
          )

          if manifest.exists():
              files = json.loads(
                  manifest.read_text(encoding="utf-8")
              )
              if files:
                  subprocess.run(
                      ["git", "add", "--", *files],
                      check=True,
                  )
          PY

          if git diff --cached --quiet; then
            echo "이번 실행에서 새로 저장할 결과가 없습니다."
          else
            git commit -m "Update career radar V2 results"
            git push
          fi

      - name: 최종 상태 확인
        if: always()
        env:
          REVIEW_RESULT: ${{ steps.review.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ.get("REVIEW_RESULT") != "success":
              raise SystemExit(
                  "결과 점검 단계를 완료하지 못했습니다."
              )

          path = Path(
              "/tmp/career-radar-v2-review.json"
          )
          if not path.exists():
              raise SystemExit("점검 결과 파일이 없습니다.")

          problems = json.loads(
              path.read_text(encoding="utf-8")
          ).get("problems", [])

          if problems:
              raise SystemExit(
                  "확인이 필요한 문제: "
                  + " / ".join(problems)
              )
          PY
