
name: Career Radar Mail

on:
  workflow_run:
    workflows:
      - "Career Radar V2"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-mail:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'schedule')

    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: career-radar-mail
      cancel-in-progress: false

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 네이버 이메일 발송
        env:
          NAVER_MAIL_USER: ${{ secrets.NAVER_MAIL_USER }}
          NAVER_MAIL_PASSWORD: ${{ secrets.NAVER_MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_digest.py

      - name: Save delivery ledger
        run: |
          if [ -f data/mail_sent.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/mail_sent.json
            git diff --cached --quiet || (git commit -m 'Record Tue Thu digest delivery' && git push)
          fi
